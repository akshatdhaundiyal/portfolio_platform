services:
  db:
    image: postgres:17
    container_name: portfolio-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=edw_platform
    ports:
      - "5432:5432"
    volumes:
      - ./db/edw_platform.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edw_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Unified Full-Stack Next.js Application (Executive Portfolio & Dynamic Blog Studio)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:admin@db:5432/edw_platform
      - ADMIN_PASSWORD=admin
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - MEDIUM_INTEGRATION_TOKEN=
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
